<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusPulse | Manage Events</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">
  
 <aside class="sidebar">
 <div class="logo">
  <div class="logo-icon">CP</div>

  <div>
    <div class="logo-text">CampusPulse</div>
   
  </div>
</div>

  <a id="dashboardLink" href="dashboard.html" onclick="toggleMenu()">
  Dashboard
</a>
  <a id="eventsLink" href="events.html"> Events</a>
  <a id="noticesLink" href="notices.html"> Notices</a>
  <a id="registrationsLink" href="my-registrations.html"> My Registrations</a>
  <a href="certificates.html" id="certificatesLink">
   Certificates
</a>
  <a id="manageEventsLink" href="manage-events.html"> Manage Events</a>
  <a id="createEventLink" href="create-event.html"> Create Event</a>
  <a id="adminDashboardLink" href="admin-dashboard.html"> Admin Dashboard</a>
  <a id="attendanceLink" href="attendance.html"> Attendance</a>
  <a id="logoutLink" href="#" onclick="logout()">Logout</a>
</aside>

  <main class="main">
    <section class="welcome">
      <div>
        <h1>Manage Events</h1>
        <p>Edit, delete, monitor registrations, and manage college events.</p>
      </div>
    </section>

    <section class="filter-tabs" style="margin-top: 20px; margin-bottom: 14px;">
      <button type="button" onclick="filterManageEvents('All')" class="active">All</button>
      <button type="button" onclick="filterManageEvents('Hackathon')">Hackathon</button>
      <button type="button" onclick="filterManageEvents('Workshop')">Workshop</button>
      <button type="button" onclick="filterManageEvents('Cultural')">Cultural</button>
      <button type="button" onclick="filterManageEvents('Sports')">Sports</button>
      <button type="button" onclick="filterManageEvents('Technical')">Technical</button>
    </section>

    <section class="filter-tabs" style="margin-bottom: 22px;">
      <input
        type="text"
        id="manageEventsSearchInput"
        placeholder="Search event by name, organizer, venue..."
        style="max-width: 450px;"
      />
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Posted Events</h2>
      </div>
      <div id="manageEventsList"></div>
    </section>
  </main>
</div>

<script src="../js/script.js"></script>
</body>
</html>
