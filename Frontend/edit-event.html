<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusPulse | Edit Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  
  <aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">CP</div>
    <div class="logo-text">CampusPulse</div>
  </div>

  <nav class="sidebar-nav">
    <a id="dashboardLink" href="dashboard.html">Dashboard</a>
    <a id="eventsLink" href="events.html">Events</a>
    <a id="noticesLink" href="notices.html">Notices</a>
    <a id="registrationsLink" href="my-registrations.html">My Registrations</a>
    <a id="certificatesLink" href="certificates.html">Certificates</a>
    <a id="manageEventsLink" href="manage-events.html">Manage Events</a>
    <a id="createEventLink" href="create-event.html">Create Event</a>
    <a id="adminDashboardLink" href="admin-dashboard.html">Admin Dashboard</a>
    <a id="attendanceLink" href="attendance.html">Attendance</a>
    <a id="logoutLink" href="#" onclick="logout()">Logout</a>
  </nav>
</aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
        <div class="topbar-logo">
          <div class="logo-icon mini">CP</div>
          <span class="logo-text mini">CampusPulse</span>
        </div>
      </div>
    </header>
    <section class="welcome">
      <div>
        <h1>Edit Event</h1>
        <p>Update event details.</p>
      </div>
    </section>

    <section class="form-card">
      <form id="editEventForm">
        <label>Event Name</label>
        <input type="text" name="title" id="editTitle" required>

        <label>Category</label>
        <input type="text" name="category" id="editCategory" required>

        <label>Organizer</label>
        <input type="text" name="organizer" id="editOrganizer" required>

        <label>Date</label>
        <input type="date" name="date" id="editDate" required>

        <label>Time</label>
        <input type="time" name="time" id="editTime" required>

        <label>Venue</label>
        <input type="text" name="venue" id="editVenue" required>

        <label>Fee</label>
        <input type="number" name="fee" id="editFee">

        <label>Description</label>
        <textarea name="description" id="editDescription" required></textarea>

        <button type="submit">Update Event</button>
      </form>
    </section>
  </main>
</div>

<script src="js/script.js"></script>
</body>
</html>
